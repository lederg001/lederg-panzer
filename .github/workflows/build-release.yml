name: Windows EXE build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # The Python dependency files live inside LEDERG-PANZER-source.zip.
          # setup-python pip caching runs before the ZIP is extracted, so omit cache here.

      - name: Extract source bundle
        run: python -c "import zipfile; zipfile.ZipFile('LEDERG-PANZER-source.zip').extractall('.')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Build standalone Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name LEDERG-PANZER --collect-all dns app.py

      - name: Verify executable exists
        run: |
          if (!(Test-Path "dist/LEDERG-PANZER.exe")) { throw "EXE was not produced" }
          Get-Item "dist/LEDERG-PANZER.exe" | Format-List Name,Length

      - name: Publish EXE as a GitHub Release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.0
          name: LEDERG PANZER v0.1.0
          target_commitish: main
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/LEDERG-PANZER.exe
          body: |
            # LEDERG PANZER v0.1.0

            Free Windows 10/11 x64 defensive assessment toolkit.

            Download **LEDERG-PANZER.exe** below from Assets.

            - DNS inventory and SPF/DMARC checks
            - HTTP security headers and cookie review
            - TLS certificate review
            - Bounded TCP port inventory for one authorized host
            - Local SQLite history; HTML and JSON reports
            - Russian interface

            Only assess systems you own or are explicitly authorized to test.
            Automated findings require manual validation.
