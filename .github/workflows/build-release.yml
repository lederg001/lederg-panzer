name: Windows EXE build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panzer-windows-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Extract source bundle
        run: python -c "import zipfile; zipfile.ZipFile('LEDERG-PANZER-source.zip').extractall('.')"

      - name: Install dependencies
        run: python -m pip install --upgrade pip; pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Build standalone Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name LEDERG-PANZER --collect-all dns app.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.0
          name: LEDERG PANZER v0.1.0
          target_commitish: main
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/LEDERG-PANZER.exe
          body: |
            # LEDERG PANZER v0.1.0

            Free Windows 10/11 x64 defensive assessment toolkit.

            - DNS: A, AAAA, MX, NS, TXT, CAA, SPF and DMARC
            - HTTP: HTTPS, security headers, CORS and cookie flags
            - TLS certificate validation and expiry
            - Bounded TCP inventory of 38 common ports on one host
            - Local SQLite history; HTML and JSON reports
            - Russian interface and field guide

            Only use against systems you own or have explicit permission to test. Findings require manual validation.
