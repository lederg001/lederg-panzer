name: LEDERG PANZER Windows x64 build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Extract source bundle
        run: python -c "import zipfile; z=zipfile.ZipFile('LEDERG-PANZER-source.zip'); z.extractall('.'); z.close()"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Build standalone Windows executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name LEDERG-PANZER
          --collect-all dns
          --collect-all psutil
          app.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/LEDERG-PANZER.exe"
          if (!(Test-Path $exe)) { throw "EXE was not produced" }
          $file = Get-Item $exe
          if ($file.Length -lt 1000000) { throw "EXE is unexpectedly small: $($file.Length) bytes" }
          Write-Host "Verified $($file.Name) ($($file.Length) bytes)"

      - name: Publish EXE to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.2.0
          name: LEDERG PANZER v0.2.0
          target_commitish: main
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/LEDERG-PANZER.exe
          body: |
            # LEDERG PANZER v0.2.0

            Free Windows 10/11 x64 defensive security toolkit.

            Download **LEDERG-PANZER.exe** from Assets below.

            - Redesigned black/red interface, custom window controls and PANZER avatar
            - Full TCP connect scan for ports 1–65535 on one authorized host
            - DNS, HTTP security headers, cookies and TLS audit
            - RDAP, Certificate Transparency and NVD CVE lookups
            - Local Windows Firewall / Microsoft Defender status
            - Confirmed local inbound IP block rule (administrator required)
            - File hashes, secure password generator, ping and traceroute
            - SQLite scan history and HTML/JSON reports

            Scope is limited to systems you own or are explicitly authorized to test.
            No retaliatory attacks, DDoS, exploitation, password guessing or stealth features.
            Findings require manual validation.
